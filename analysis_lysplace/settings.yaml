# RGD+ lysine-placement submodule - frozen definitions. Written 2026-10-16.
#
# What had been seen before this file was written: the run sheets, the design table
# (00_inventory.py) and, from the crosslink event logs, the per-class mean numbers of crosslinks
# formed and of inter-chain crosslinks (used to check the data: uniform ~18.5, scramble ~18.6,
# random ~13.4, focused ~7.0, clustered ~3.1 bridges per run). Nothing about network topology,
# z distributions, timing, per-lysine outcomes or descriptor effects had been computed.
# Change nothing here after looking at results; add a dated note instead.

data:
  runs: 130                       # 5 sheets, all crosslinking on (0.8 nm, p = 1, valence 1), 16 chains,
                                  # C = 0.04 chains/nm2, 0.19 M, 293.15 K, preattached 0.3 (19 of 64 K pinned)
  replicates: none                # every design is simulated once; noise is judged within classes
  classes: [clustered, focused, random, uniform, scramble]
  scramble: >-
    the sheet without a class suffix. Every design has one K per block, like uniform, so it is
    kept as its own class in every test and additionally pooled with uniform as "one_per_block"
    in the structural analysis. Whether it differs from uniform is reported, not assumed.

network:                          # from crosslink_events.csv; the state at the end of the run
  primary: n_bridges              # inter-chain K-K crosslinks per run (16 chains); the submodule's goal
  max_bonds: 22                   # floor((64 - 19) / 2): valence 1, pinned lysines cannot react
  secondary:
    - n_loops                     # intra-chain K-K crosslinks (elastically inactive primary loops)
    - n_formed
    - bridge_frac                 # bridges / formed
    - n_pairs_bridged             # distinct chain pairs joined by >= 1 bridge (elastically distinct links)
    - secondary_loops             # n_bridges - n_pairs_bridged: extra bridges between already-joined chains
    - largest_cluster_frac        # largest set of chains connected by bridges / 16 (surface not a node)
    - cycle_rank                  # n_bridges - 16 + n_components: independent network cycles among chains
    - n_unreacted                 # free (not pinned) lysines left without a partner
  at_times_ns: [100, 400]         # network also reported at 100 ns; event frames are not kinetics
  timing: "t50 / t90 of the final bridges, ns after crosslinking starts (10 ns); descriptive only"

structure:                        # from the trajectories, production window as in SubM4
  discard_frames: 1428            # 100 ns; production = frames 1428-5713 (300 ns)
  z_reference: wall               # heights in nm above z_wall (1.9 nm); z is the surface normal
  brush_height: mass-weighted h50 and h95 of all beads, per frame, averaged over production
  bond_height: >-
    z of the midpoint of the two bonded K beads, every production frame at or after the bond's
    formation frame; summarised per run as mean, median and as fraction of bond-frames above h50
    (of the same frame), separately for bridges and loops; also normalised by h95 (z / h95)
  lysine_height: mean z per lysine over production, by state (pinned, bridge, loop, unreacted)
  rgd_height: >-
    the R, G, D beads of the four GRGDS motifs: mean z and fraction above h50 (exposure proxy,
    secondary; the construct is RGD+)
  profiles: 2 A bins from the wall, production-averaged, for mass, lysines, bridges, loops, RGD
  chain_size: Rg and Ree per chain (chains are written whole)

comparison:                       # 03_compare.py
  tests: Kruskal-Wallis over the 5 classes; pairwise Mann-Whitney U, Holm-adjusted over the 10 pairs
  effect_size: Cliff's delta with bootstrap 95 % CI; medians with bootstrap 95 % CI
  bootstrap: 10000
  alpha: 0.05
  descriptors_model: >-
    quasi-binomial GLM (logit) of n_bridges out of max_bonds on the design descriptors
    log(min_sep_res), n_blocks_with_K (numeric 1-4) and centroid_rel; across all 130 runs and
    within random only (the one class whose descriptors span the range); 5-fold CV

lysine_model:                     # 04_lysine_model.py
  unit: every lysine that is not surface-pinned (130 runs x 45)
  outcomes: [bridge, loop, unreacted]
  model: >-
    logistic GEE (exchangeable within run) for P(bridge) and for P(loop), predictors fixed in
    advance: log of the sequence distance to the nearest other K on the same chain, the number of
    other K within 30 residues on the same chain, whether the nearest K on the same chain is pinned,
    and relative position along the chain (linear + quadratic)
  validation: run-level expected bridges = sum P(bridge) / 2, 10-fold CV by run, vs observed
  optimisation: >-
    expected bridges for every design of 4 K on the VPGXG positions (no K on the M positions),
    pinning averaged analytically (each K pinned with probability 19/64, nearest-K-pinned term
    averaged accordingly); recommendations only inside the descriptor range covered by the data

optimal:
  rule: >-
    1. most inter-chain crosslinks (n_bridges, primary). 2. a class or design counts as optimal only
    if its network is connected (largest_cluster_frac = 1) in >= 90 % of its runs. 3. among those
    not separable on n_bridges (Holm p >= 0.05), prefer more distinct bridged chain pairs, then the
    smaller between-run spread (IQR of n_bridges).

seed: 20261016

# ---- dated notes (after results) ---------------------------------------------------------------
# 2026-10-16: the connectivity gate of the optimality rule (largest_cluster_frac = 1 in >= 90 % of
# a class's runs) is met by no class: uniform 48 %, scramble 45 %, random 14 %, focused and
# clustered 0 %. The rule above is left unchanged; the README reports this outcome and the ranking
# on the primary response separately. A future rule should state connectivity as a reported
# outcome or use a gate grounded in a target (e.g. a percolation requirement), set before running.
# 2026-10-16: uniform and scramble differ on no response (all Holm p > 0.6); they are reported
# separately as designed and pooled as "one per block" where noted.
